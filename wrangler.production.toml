# Configuratie separata pentru productie. Nu modificati wrangler.toml folosit de test.
name = "vodafone-business-hunting-crm"
main = "src/index.js"
compatibility_date = "2026-10-29"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[r2_buckets]]
binding = "DOCS"
bucket_name = "vodafone-crm-docs"

[vars]
SESSION_HOURS = "12"
